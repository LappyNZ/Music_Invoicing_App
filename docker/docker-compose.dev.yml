services:
  music-invoice-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: music-invoice-dev

    # TZ, PORT and everything else come from this file
    env_file:
      - ../.env.dev

    volumes:
      - ../app:/app
      - ../data-dev:/data-dev
      - ../secrets:/secrets

    ports:
      - "8086:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5