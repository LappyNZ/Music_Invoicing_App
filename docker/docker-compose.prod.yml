services:
  music-invoice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: music-invoice

    # TZ, PORT and everything else come from this file
    env_file:
      - ../.env.prod

    volumes:
      - ../app:/app:ro
      - ../data:/data
      - ../secrets:/secrets

    ports:
      - "8085:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5