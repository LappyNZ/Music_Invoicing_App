services:
  music-invoice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: music-invoice

    env_file:
      - ../.env.prod

    environment:
      - TZ=${TZ}

    volumes:
      - ../app:/app:ro
      - ../data:/data
      - ../secrets:/secrets

    ports:
      - "8085:8000"
      - "8095:8090"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5