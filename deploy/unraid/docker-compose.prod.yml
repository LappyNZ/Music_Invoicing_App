# The app on the Unraid server. Lives at /mnt/user/appdata/music-invoice/docker-compose.prod.yml,
# next to .env.prod. See README.md in this folder for updating, rolling back and backups.
services:
  music-invoice:
    # "latest" is published from the main branch on GitHub. To pin (or roll back to) a version,
    # use its commit tag instead, e.g. ghcr.io/lappynz/music_invoicing_app:sha-32d6a47
    image: ghcr.io/lappynz/music_invoicing_app:latest
    container_name: music-invoice

    # TZ, PORT and everything else come from this file
    env_file:
      - .env.prod

    volumes:
      - /mnt/user/appdata/music-invoice/data:/data
      - /mnt/user/appdata/music-invoice/secrets:/secrets

    ports:
      - "8085:8000"
      - "8095:8090"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
